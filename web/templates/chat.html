<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conga CLM AI Agent</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/chat.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/logger.css') }}">
    <link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='img/favicon.ico') }}">
    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Socket.IO -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.2/socket.io.js"></script>
    <!-- Marked for markdown rendering -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header class="chat-header">
            <div class="header-content">
                <div class="logo">
                    <i class="fas fa-robot"></i>
                    <h1>Conga CLM AI Agent</h1>
                </div>
                <div class="connection-status" id="connectionStatus">
                    <i class="fas fa-circle"></i>
                    <span>Connecting...</span>
                </div>
            </div>
        </header>

        <!-- Chat Container -->
        <div class="chat-container">
            <!-- Chat Messages -->
            <div class="chat-messages" id="chatMessages">
                <!-- Messages will be dynamically added here -->
            </div>

            <!-- Typing Indicator -->
            <div class="typing-indicator" id="typingIndicator" style="display: none;">
                <div class="typing-dots">
                    <span></span>
                    <span></span>
                    <span></span>
                </div>
                <span>AI Agent is thinking...</span>
            </div>
        </div>

        <!-- Input Area -->
        <div class="input-area">
            <div class="input-container">
                <button class="action-btn" id="clearBtn" title="Clear conversation">
                    <i class="fas fa-trash"></i>
                </button>
                <textarea
                    id="messageInput"
                    placeholder="Ask me about contracts... (e.g., 'Create an MSA with Acme Corp for $50k')"
                    rows="1"
                    maxlength="2000"
                ></textarea>
                <button class="send-btn" id="sendBtn" title="Send message">
                    <i class="fas fa-paper-plane"></i>
                </button>
            </div>
            <div class="input-footer">
                <div class="shortcuts">
                    <button class="shortcut-btn" data-message="help">
                        <i class="fas fa-question-circle"></i> Help
                    </button>
                    <button class="shortcut-btn" data-message="status">
                        <i class="fas fa-heartbeat"></i> Status
                    </button>
                </div>
                <div class="char-counter">
                    <span id="charCounter">0/2000</span>
                </div>
            </div>
        </div>
    </div>

    <!-- Quick Actions Sidebar -->
    <div class="quick-actions" id="quickActions">
        <div class="quick-actions-header">
            <h3>Quick Actions</h3>
            <button class="close-btn" id="closeQuickActions">
                <i class="fas fa-times"></i>
            </button>
        </div>
        <div class="quick-actions-content">
            <div class="action-group">
                <h4>Contract Management</h4>
                <button class="action-item" data-message="Find all active contracts">
                    <i class="fas fa-search"></i> Find Active Contracts
                </button>
                <button class="action-item" data-message="Show me expiring contracts">
                    <i class="fas fa-calendar-times"></i> Expiring Contracts
                </button>
                <button class="action-item" data-message="Find accounts matching">
                    <i class="fas fa-building"></i> Search Accounts
                </button>
            </div>
            <div class="action-group">
                <h4>Examples</h4>
                <button class="action-item" data-message="Create an MSA with Acme Corp for $50,000 starting next month">
                    <i class="fas fa-plus-circle"></i> Create MSA Example
                </button>
                <button class="action-item" data-message="Find all NDA contracts with TechCorp">
                    <i class="fas fa-shield-alt"></i> Find NDA Example
                </button>
                <button class="action-item" data-message="Activate contract">
                    <i class="fas fa-play-circle"></i> Activate Contract
                </button>
            </div>
        </div>
    </div>

    <!-- Mobile Menu Toggle -->
    <button class="mobile-menu-toggle" id="mobileMenuToggle">
        <i class="fas fa-bars"></i>
    </button>

    <!-- Error Toast -->
    <div class="toast error-toast" id="errorToast">
        <i class="fas fa-exclamation-triangle"></i>
        <span id="errorMessage"></span>
        <button class="toast-close" onclick="hideToast('errorToast')">
            <i class="fas fa-times"></i>
        </button>
    </div>

    <!-- Success Toast -->
    <div class="toast success-toast" id="successToast">
        <i class="fas fa-check-circle"></i>
        <span id="successMessage"></span>
        <button class="toast-close" onclick="hideToast('successToast')">
            <i class="fas fa-times"></i>
        </button>
    </div>

    <script src="{{ url_for('static', filename='js/logger.js') }}"></script>
    <script src="{{ url_for('static', filename='js/chat.js') }}"></script>
</body>
</html>
