<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 400px;
      padding: 20px;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: white;
      color: #333;
      margin: 0;
      border: 1px solid #ddd;
    }

    .header {
      text-align: center;
      margin-bottom: 25px;
    }

    .header h2 {
      margin: 0;
      font-size: 18px;
      font-weight: 600;
      color: #333;
    }

    .header p {
      margin: 5px 0 0 0;
      font-size: 12px;
      color: #666;
    }

    .form-group {
      margin-bottom: 15px;
    }

    label {
      display: block;
      margin-bottom: 5px;
      font-size: 12px;
      font-weight: 500;
      color: #333;
    }

    input[type="text"], input[type="password"] {
      width: 100%;
      padding: 10px;
      border: 1px solid #ddd;
      border-radius: 4px;
      font-size: 14px;
      background: white;
      color: #333;
      box-sizing: border-box;
    }

    input[type="text"]:focus, input[type="password"]:focus {
      border-color: #007cba;
      outline: none;
    }

    input[type="text"]::placeholder,
    input[type="password"]::placeholder {
      color: #999;
    }

    .security-notice {
      background: #f9f9f9;
      padding: 12px;
      border-radius: 4px;
      margin-bottom: 20px;
      font-size: 11px;
      border-left: 3px solid #4CAF50;
    }

    .security-notice h4 {
      margin: 0 0 8px 0;
      font-size: 12px;
      color: #4CAF50;
    }

    .security-notice ul {
      margin: 0;
      padding-left: 15px;
    }

    .security-notice li {
      margin-bottom: 3px;
      color: #666;
    }

    .button-group {
      display: flex;
      gap: 10px;
      margin-top: 20px;
    }

    button {
      flex: 1;
      padding: 12px;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn-primary {
      background: #007cba;
      color: white;
    }

    .btn-primary:hover {
      background: #005a85;
    }

    .btn-secondary {
      background: #f5f5f5;
      color: #333;
      border: 1px solid #ddd;
    }

    .btn-secondary:hover {
      background: #e9e9e9;
    }

    .status {
      text-align: center;
      margin-top: 15px;
      font-size: 12px;
      padding: 8px;
      border-radius: 6px;
    }

    .status.connected {
      background: #e8f5e8;
      color: #4CAF50;
      border: 1px solid #c8e6c9;
    }

    .status.error {
      background: #ffebee;
      color: #f44336;
      border: 1px solid #ffcdd2;
    }

    .chat-container {
      margin-top: 20px;
      display: none;
    }

    .chat-input {
      width: 100%;
      padding: 10px;
      border: 1px solid #ddd;
      border-radius: 4px;
      resize: vertical;
      min-height: 60px;
      background: white;
      color: #333;
      box-sizing: border-box;
    }

    .chat-input:focus {
      border-color: #007cba;
      outline: none;
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>
  <div class="header">
    <h2>🤖 Conga AI Assistant</h2>
    <p>Secure session-based AI assistance</p>
  </div>

  <div id="credentialsForm">
    <div class="security-notice">
      <h4>🔒 Security Features:</h4>
      <ul>
        <li>Credentials stored in session only</li>
        <li>Automatically cleared when tab closes</li>
        <li>Direct API connections (no third-party)</li>
        <li>No permanent storage</li>
      </ul>
    </div>

    <div class="form-group">
      <label>Conga Client ID:</label>
      <input type="text" id="clientId" placeholder="Enter your Conga Client ID">
    </div>

    <div class="form-group">
      <label>Conga Client Secret:</label>
      <input type="password" id="clientSecret" placeholder="Enter your Conga Client Secret">
    </div>

    <div class="form-group">
      <label>Conga Auth URL:</label>
      <input type="text" id="authUrl" value="https://login-rlspreview.congacloud.com/api/v1/auth/connect/token">
    </div>

    <div class="form-group">
      <label>Conga Base URL:</label>
      <input type="text" id="baseUrl" value="https://preview-rls09.congacloud.com">
    </div>

    <div class="form-group">
      <label>Anthropic API Key:</label>
      <input type="password" id="anthropicKey" placeholder="Enter your Claude API key">
    </div>

    <div class="button-group">
      <button class="btn-primary" id="connectBtn">🔐 Connect & Start Session</button>
      <button class="btn-secondary" id="clearBtn">🗑️ Clear</button>
    </div>
  </div>

  <div id="connectedState" class="hidden">
    <div class="status connected">
      ✅ Connected - Session Active
    </div>

    <div class="chat-container" style="display: block;">
      <div class="form-group">
        <label>Ask anything about your contracts:</label>
        <textarea class="chat-input" id="userQuery" placeholder="e.g., 'Find all contracts with ABC Corp' or 'Create an MSA with TechCorp'"></textarea>
      </div>

      <div class="button-group">
        <button class="btn-primary" id="sendBtn">💬 Send Query</button>
        <button class="btn-secondary" id="disconnectBtn">🔒 End Session</button>
      </div>
    </div>
  </div>

  <div id="status" class="status hidden"></div>

  <script src="popup.js"></script>
</body>
</html>
